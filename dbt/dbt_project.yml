name: india_market
version: "1.0.0"
config-version: 2
profile: india_market

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  risk_free_rate: 0.065          # ~ 1Y T-bill, for Sharpe ratio
  trading_days_per_year: 252
  min_stocks_per_trading_day: 1500

models:
  india_market:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: gold
      kpi:
        +schema: gold

snapshots:
  india_market:
    +schema: snapshots
